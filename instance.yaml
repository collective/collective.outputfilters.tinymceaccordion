default_context:
  # Location in Filesystem
  # see: https://plone.github.io/cookiecutter-zope-instance/reference/base-locations.html
  # Attention: this is relative to the current directory
  target: instance

  # settings
  initial_user_name: "admin"
  initial_user_password: "admin"  
  wsgi_listen: "localhost:8080"
  debug_mode: true
  verbose_security: true

  # storage
  db_storage: direct

  # Configure logging
  log_stdout: true
  log_file: true
  log_file_path: "{{ cookiecutter.target }}/var/log/instance.log"
  logging_loggers:
    plone: INFO
    waitress: WARNING
