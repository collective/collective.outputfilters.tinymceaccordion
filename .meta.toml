# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.9.0"


[gitignore]
extra_lines = """
report.html
log.html
output.xml
robot_log.html
robot_output.xml
robot_report.html
forest.dot
forest.json
.lock
"""


[pyproject]
codespell_skip = "*.min.js"
codespell_ignores = "vew"
dependencies_mappings = [
    "beautifulsoup4 = ['bs4']",
    ]
dependencies_ignores = "['zest.pocompile', 'zestreleaser.towncrier', 'zest.releaser', 'pytest-cov', 'pytest']"


[tox]
test_matrix = { "6.2" = ["3.14", "3.13", "3.12", "3.11",], "6.1" = ["3.14", "3.13", "3.12", "3.11",] }
extra_lines = """
[coverage:run]
omit =
    */tests/*
    */upgrades/*
    */locales/*
"""

[github]
extra_lines_after_os_dependencies = """
    - name: Install libxml2 and libxslt to compile lxml
      run: sudo apt install -y libxml2-dev and libxslt1-dev
"""
