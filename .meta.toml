# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"


[gitignore]
extra_lines = """
report.html
log.html
output.xml
robot_log.html
robot_output.xml
robot_report.html
forest.dot
forest.json
.lock
"""


[pyproject]
codespell_skip = "*.min.js"
codespell_ignores = "vew"
dependencies_mappings = [
    "beautifulsoup4 = ['bs4']",
    ]
dependencies_ignores = "['zest.pocompile', 'zestreleaser.towncrier', 'zest.releaser', 'pytest-cov', 'pytest']"

[github]
jobs = [
    "qa",
    "coverage",
    "dependencies",
    "release_ready",
]


[tox]
test_runner = "pytest"
use_test_matrix = true
constraints_files = {
    "6.2" = "https://dist.plone.org/release/6.2-latest/constraints.txt",
    "6.1" = "https://dist.plone.org/release/6.1-latest/constraints.txt",
    "6.0" = "https://dist.plone.org/release/6.0-latest/constraints.txt",
}
test_matrix = {
    "6.2" = ["3.14", "3.13", "3.12", "3.11", "3.10"],
    "6.1" = ["3.13", "3.12", "3.11", "3.10"],
    "6.0" = ["3.13", "3.12", "3.11", "3.10"],
}
